  <script>
    // Runs before the first paint so the page never flashes in the other theme.
    (function () {
      var theme = 'auto';
      try { theme = JSON.parse(localStorage.getItem('coundo-state')).settings.theme; } catch (e) {}
      if (theme !== 'light' && theme !== 'dark') theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = theme;
      // The launch picture fills the screen but the page starts below the status bar, so line the two up.
      if (navigator.standalone) document.documentElement.style.setProperty('--splash-nudge', -(screen.height - innerHeight) / 2 + 'px');
    })();
  </script>
